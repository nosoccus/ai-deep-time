<style>
/* Layout: a cinematic hero driven by a sticky timeline scrubber; dashboard cards below; long-form sections after.
   Dark-first "deep time" observatory look; light theme is crisp observatory paper. Era hue travels with the playhead. */
@property --era { syntax: '<color>'; inherits: true; initial-value: #E0B45A; }
@property --era-ink { syntax: '<color>'; inherits: true; initial-value: #8A6410; }
:root {
  color-scheme: dark;
  --bg: #07090D; --bg-2: #0E1219; --bg-3: #151A24; --line: #222938;
  --fg: #ECE8DF; --fg-2: #A6ADB9; --fg-3: #7D8596;
  --era: #E0B45A; --era-ink: #8A6410;
  --accent: var(--era);
  --on-accent: #07090D;
  --glow-c: color-mix(in srgb, var(--accent) 40%, transparent);
  --glow-s: color-mix(in srgb, var(--accent) 22%, transparent);
  --tint: color-mix(in srgb, var(--accent) 14%, transparent);
  --c-back: #FF7A7A; --c-ok: #6EE08F; --c-warn: #FFD166;
  --display: 'Unbounded', 'Arial Black', Arial, sans-serif;
  --serif: 'Literata', Georgia, 'Times New Roman', serif;
  --mono: 'JetBrains Mono', 'Courier New', monospace;
  --hdr-h: 52px;
  --scrub-h: 118px;
  --r: 14px;
  transition: --era .6s ease, --era-ink .6s ease;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #EDF0F4; --bg-2: #F8F9FB; --bg-3: #FFFFFF; --line: #D3D9E2;
    --fg: #10141B; --fg-2: #4A5260; --fg-3: #5C6474;
    --accent: var(--era-ink);
    --on-accent: #F8F9FB;
    --glow-c: transparent; --glow-s: transparent;
    --tint: color-mix(in srgb, var(--accent) 12%, transparent);
    --c-back: #C62828; --c-ok: #1B7A3F; --c-warn: #9A6A00;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #EDF0F4; --bg-2: #F8F9FB; --bg-3: #FFFFFF; --line: #D3D9E2;
  --fg: #10141B; --fg-2: #4A5260; --fg-3: #5C6474;
  --accent: var(--era-ink);
  --on-accent: #F8F9FB;
  --glow-c: transparent; --glow-s: transparent;
  --tint: color-mix(in srgb, var(--accent) 12%, transparent);
  --c-back: #C62828; --c-ok: #1B7A3F; --c-warn: #9A6A00;
}
@media (prefers-reduced-motion: reduce) { :root { transition: none; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 16px/1.55 var(--serif); font-optical-sizing: auto;
  min-width: 320px; overflow-x: hidden;
}
[hidden] { display: none !important; }
a { color: inherit; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 100; padding: 8px 12px; background: var(--bg-3); border: 1px solid var(--accent); border-radius: 8px; font: 13px var(--mono); }
.skip:focus { top: 8px; }
.wrap { max-width: 1200px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
.mono { font-family: var(--mono); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- type ---------- */
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
h2.sec { font: 300 clamp(26px, 3.6vw, 40px)/1.12 var(--display); letter-spacing: -.012em; margin-block: 0 12px; }
h3 { font: 500 20px/1.3 var(--display); }
p { margin: 0 0 .9em; }
p:last-child { margin-bottom: 0; }
.lede { font-size: 18px; color: var(--fg-2); max-width: 64ch; }
.eyebrow { font: 500 12px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.eyebrow.mute { color: var(--fg-3); }
.small { font-size: 13px; color: var(--fg-2); }
.meta { font: 12px/1.5 var(--mono); color: var(--fg-3); }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
section.block { padding-block: clamp(44px, 7vw, 88px); border-top: 1px solid var(--line); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1 var(--mono); padding: 10px 16px; border: 1px solid var(--line); background: var(--bg-3); color: var(--fg); border-radius: 999px; cursor: pointer; transition: border-color .2s, background .2s, transform .1s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 0 28px var(--glow-s); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-3); cursor: pointer; font: 600 14px var(--mono); }
.icon-btn:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg-2); }
.seg button { border: 0; background: transparent; color: var(--fg-2); font: 500 12px/1 var(--mono); padding: 7px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .02em; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--bg-3); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--mono); padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg-2); cursor: pointer; }
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { border-color: var(--accent); color: var(--fg); background: var(--tint); }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--sw, var(--fg-3)); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.est { display: inline-block; font: 500 10px/1.2 var(--mono); letter-spacing: .06em; border: 1px dashed var(--fg-3); color: var(--fg-2); padding: 2px 5px; border-radius: 4px; vertical-align: middle; text-transform: lowercase; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: transparent; color: var(--fg-2); font: 500 12px/1 var(--mono); letter-spacing: .04em; padding: 9px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--fg-2); font: 500 12px var(--mono); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link:hover { color: var(--accent); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
select, input[type="text"], textarea { font: 14px var(--serif); background: var(--bg-3); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea { width: 100%; min-height: 72px; resize: vertical; font-size: 15px; }

/* ---------- header ---------- */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; height: var(--hdr-h); display: flex; align-items: center; gap: 16px; padding-inline: clamp(12px, 3vw, 28px); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.wordmark { font: 500 15px/1 var(--display); letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.wordmark .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--glow-c); margin-right: 8px; vertical-align: 1px; }
.hdr-nav { display: flex; gap: 2px; margin-left: 8px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
.hdr-nav a { font: 500 12px/1 var(--mono); color: var(--fg-2); text-decoration: none; padding: 8px 10px; border-radius: 8px; letter-spacing: .03em; white-space: nowrap; }
.hdr-nav a:hover { color: var(--fg); background: var(--bg-3); }
.hdr-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.wordmark { flex: none; }
@media (max-width: 920px) { .hdr-nav a { padding: 8px 6px; letter-spacing: 0; } }
@media (max-width: 760px) { .hdr-nav { display: none; } }

/* ---------- hero ---------- */
.hero { position: relative; padding-block: clamp(28px, 5vw, 64px) clamp(24px, 4vw, 48px); overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -20% -10% auto -10%; height: 90%; pointer-events: none; background: radial-gradient(55% 60% at 28% 35%, var(--glow-s), transparent 70%); opacity: 1; transition: opacity .6s; z-index: 0; }
.hero > .wrap { position: relative; z-index: 1; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px clamp(28px, 5vw, 72px); align-items: start; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } }
.hero-left { min-width: 0; }
.hero-intro { font-size: 15px; color: var(--fg-2); max-width: 60ch; margin-bottom: 18px; }
.hero-intro:empty { display: none; }
.stage-title { font: 500 clamp(20px, 2.4vw, 26px)/1.25 var(--display); margin-top: 6px; }
.year { font: 200 clamp(96px, 18vw, 240px)/1 var(--display); letter-spacing: -.03em; color: var(--fg); margin: 6px 0 2px -0.04em; text-shadow: 0 0 46px var(--glow-c); display: flex; user-select: none; }
.year .digit { display: inline-block; height: 1em; overflow: hidden; transition: width .3s ease; }
.year .reel { display: block; transform: translateY(calc(var(--d, 0) * -10%)); transition: transform .55s cubic-bezier(.2, .75, .2, 1); will-change: transform; }
@media (prefers-reduced-motion: reduce) { .year .reel, .year .digit, .track .head { transition: none; } }
.year .reel span { display: block; height: 1em; line-height: 1; }
.era-sub { font: 300 clamp(17px, 2vw, 21px)/1.35 var(--display); color: var(--fg-2); max-width: 30ch; margin-bottom: 18px; }
.era-summary { max-width: 58ch; font-size: 17px; color: var(--fg); }
.era-summary p { margin-bottom: .6em; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.hero-right { display: grid; gap: 16px; min-width: 0; }

.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(16px, 2.4vw, 24px); min-width: 0; }
.card.ms { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: 0 0 0 1px transparent, 0 10px 40px -20px var(--glow-c); position: relative; }
.card.ms::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 14px var(--glow-c); }
.ms-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.ms-date { font: 500 12px/1.3 var(--mono); color: var(--fg-2); letter-spacing: .04em; }
.ms-kind { font: 500 11px/1 var(--mono); color: var(--fg-3); letter-spacing: .1em; text-transform: uppercase; }
.ms-title { font: 500 clamp(19px, 2.2vw, 24px)/1.25 var(--display); margin-bottom: 4px; }
.ms-who { font-style: italic; color: var(--fg-2); margin-bottom: 12px; }
.ms-body dl { margin: 0; display: grid; gap: 10px; }
.ms-body dt { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 2px; }
.ms-body dd { margin: 0; }
.nums { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.stat { display: grid; gap: 2px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-3); min-width: 0; }
.stat .v { font: 600 18px/1.1 var(--mono); color: var(--fg); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stat .l { font: 11px/1.3 var(--mono); color: var(--fg-3); }
.stat .n { font-size: 11px; color: var(--fg-3); font-style: italic; }
.caveat { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--fg-3); border-radius: 10px; font-size: 13px; color: var(--fg-2); }
.caveat b { font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); display: block; margin-bottom: 4px; }
.caveat.quiet { border: 0; border-left: 2px solid var(--line); border-radius: 0; padding: 2px 0 2px 12px; color: var(--fg-3); font-size: 12.5px; }
.ms-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 14px; }
.ms-nav { display: flex; gap: 6px; }

.card.ex { background: var(--bg-3); border-style: solid; border-left: 3px solid var(--accent); font-family: var(--serif); }
.ex-label { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.ex-label::before { content: ""; width: 14px; height: 1px; background: var(--accent); }
.ex-body { font-size: 16px; font-style: italic; font-variation-settings: "opsz" 12; }
.memo { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.memo .ex-label { color: var(--fg-2); }
.memo .ex-label::before { background: var(--fg-3); }
.memo p { font-style: normal; font-size: 15px; }

/* ---------- scrubber ---------- */
/* Sticky to both edges: pinned at the viewport bottom on first paint (visible ahead of the reader), it rides up to its
   natural place under the hero and then sticks under the header. */
.scrub { position: sticky; top: calc(var(--hdr-h) + env(safe-area-inset-top, 0px)); bottom: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-block: 1px solid var(--line); }
.scrub .wrap { padding-block: 10px 6px; }
.scrub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 4px; }
.scrub-row .grow { flex: 1 1 auto; }
.cal-caption { font: 12px/1.3 var(--mono); color: var(--fg-2); flex-basis: 100%; }
.cal-caption:empty { display: none; }
.track { position: relative; height: 60px; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; outline-offset: 4px; border-radius: 8px; }
.track:focus-visible { outline: 2px solid var(--accent); }
.track .bands { position: absolute; left: 0; right: 0; top: 30px; height: 6px; border-radius: 3px; overflow: hidden; }
.track .band { position: absolute; top: 0; height: 100%; background: color-mix(in srgb, var(--bc) 22%, transparent); transition: background .3s; }
.track .band.on { background: color-mix(in srgb, var(--bc) 50%, transparent); }
.track .base { position: absolute; left: 0; right: 0; top: 25px; height: 2px; background: var(--line); border-radius: 2px; }
.track .fuse { position: absolute; left: 0; right: 0; top: 24px; height: 4px; border-radius: 2px; clip-path: inset(0 calc(100% - var(--x, 0%)) 0 0); box-shadow: 0 0 14px var(--glow-c); }
.track .tick { position: absolute; top: 14px; width: 1px; height: 10px; background: var(--fg-3); opacity: .75; transform: translateX(-.5px); }
.track .tick.s5 { top: 9px; height: 15px; width: 2px; background: var(--fg-2); transform: translateX(-1px); }
.track .tick.past { background: var(--tc); opacity: .95; }
.track .tick.on { background: var(--accent); box-shadow: 0 0 10px var(--glow-c); opacity: 1; }
.track .head { position: absolute; top: 26px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 22px 4px var(--glow-c); transition: left .18s ease-out; }
.track.drag .head, .track.anim .head { transition: none; }
.track .head::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--accent); opacity: .5; }
.track .decade { position: absolute; top: 42px; font: 500 11px/1 var(--mono); color: var(--fg-3); transform: translateX(-50%); letter-spacing: .02em; }
.track .float { position: absolute; bottom: 100%; margin-bottom: 2px; transform: translateX(-50%); white-space: nowrap; font: 500 12px/1.2 var(--mono); background: var(--bg-3); border: 1px solid var(--accent); color: var(--fg); padding: 6px 10px; border-radius: 8px; pointer-events: none; box-shadow: 0 6px 24px -8px var(--glow-c); z-index: 2; }
.track .float b { color: var(--accent); font-weight: 500; }
.hint { font: 11px/1.4 var(--mono); color: var(--fg-3); margin-top: 2px; letter-spacing: .02em; }
.hint kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg-2); }
@media (max-width: 720px) {
  .scrub { position: fixed; top: auto; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--line); }
  .scrub .wrap { padding-block: 8px 4px; }
  .scrub .hint { display: none; }
  body { padding-bottom: var(--scrub-h); }
  .track { height: 54px; }
}
[data-winter="true"] .track .bands, [data-winter="true"] .track .fuse, [data-winter="true"] .hero::before, [data-winter="true"] .starfield { filter: saturate(.75); }

/* ---------- dashboard ---------- */
.dash { padding-block: clamp(32px, 5vw, 64px) clamp(40px, 6vw, 80px); }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; align-items: start; }
.dash-grid > .card { min-width: 0; }
.span5 { grid-column: span 5; } .span7 { grid-column: span 7; } .span12 { grid-column: span 12; }
@media (max-width: 1000px) { .span5, .span7 { grid-column: span 12; } }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 14px; }
.panel-head h3 { font-size: 17px; }
.prov { margin-bottom: 14px; }
.prov-name { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); margin-bottom: 8px; }
.prov-name .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--sw); }
.model { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.model:first-of-type { border-top: 0; }
.model .nm { font: 500 15px/1.3 var(--display); }
.model .dt { font: 11px/1.3 var(--mono); color: var(--fg-3); text-align: right; white-space: nowrap; }
.model .sp { grid-column: 1 / -1; font: 12px/1.4 var(--mono); color: var(--fg-2); }
.model .hl { grid-column: 1 / -1; font-size: 14px; color: var(--fg-2); }
.sys { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; display: grid; gap: 2px; }
.sys:first-child { border-top: 0; }
.sys:hover .nm { color: var(--accent); }
.sys .nm { font: 500 15px/1.3 var(--display); }
.sys .dt { font: 11px var(--mono); color: var(--fg-3); }
.sys .wh { font-size: 14px; color: var(--fg-2); }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--fg-2); font-size: 14px; }
.lineage { margin-top: 12px; }
.lineage summary { font: 500 12px var(--mono); color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; padding: 6px 0; }
.lineage summary::before { content: "+"; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 4px; }
.lineage[open] summary::before { content: "−"; }
.table-wrap { overflow-x: auto; margin-top: 10px; }
.table-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
table.data { border-collapse: collapse; width: 100%; font: 12px/1.4 var(--mono); }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
table.data th { color: var(--fg-3); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
table.data td.wrap { white-space: normal; min-width: 180px; font-family: var(--serif); font-size: 13px; }
table.data tr.fut { opacity: .45; }

/* ---------- charts ---------- */
.chart-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; font-family: var(--mono); overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.chart .axis text { fill: var(--fg-3); font-size: 11px; }
.chart .axis line, .chart .axis path { stroke: var(--line); }
.chart .grid line { stroke: var(--line); stroke-opacity: .7; }
.chart .ser { fill: none; stroke: var(--fg-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ser.ghost { stroke: var(--fg-3); stroke-opacity: .45; stroke-dasharray: 3 4; }
.chart .area { fill: var(--fg-2); fill-opacity: .06; }
.chart .pt { stroke: var(--bg-2); stroke-width: 2; }
.chart .pt.ghost { fill: var(--fg-3); fill-opacity: .4; }
.chart .pt.hot { stroke: var(--fg); }
.chart .cursor { stroke: var(--accent); stroke-width: 1.5; }
.chart .cursor-lbl { fill: var(--accent); font-size: 11px; font-weight: 500; }
.chart .ref { stroke: var(--fg-3); stroke-dasharray: 4 4; }
.chart .ref-lbl { fill: var(--fg-2); font-size: 10.5px; }
.chart .lbl { fill: var(--fg-2); font-size: 11px; }
.chart .lbl.strong { fill: var(--fg); font-weight: 500; }
.chart .bar { fill: var(--fg-2); }
.chart .annot { fill: var(--fg-2); font-size: 11px; }
.chart .fit { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 5; fill: none; }
.chart-tip { position: absolute; z-index: 5; pointer-events: none; background: var(--bg-3); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: 12px/1.4 var(--mono); color: var(--fg-2); min-width: 140px; max-width: 240px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.chart-tip .v { font-size: 15px; font-weight: 600; color: var(--fg); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chart-tip .k { display: flex; align-items: center; gap: 6px; color: var(--fg); }
.chart-tip .k i { display: inline-block; width: 12px; height: 2px; background: var(--kc, var(--fg-3)); }
.chart-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; margin-top: 8px; }
.chart-foot .cav { font-size: 12px; color: var(--fg-3); max-width: 70ch; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.chart-empty div { background: color-mix(in srgb, var(--bg-2) 86%, transparent); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; max-width: 46ch; font-size: 14px; color: var(--fg-2); backdrop-filter: blur(3px); }
.chart-empty b { display: block; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
.tbl-view summary { font: 500 12px var(--mono); color: var(--fg-3); }

/* ---------- architecture ---------- */
/* One column at every width: the diagram gets the full card width (up to 1120 px) above its text. */
.arch-grid { display: grid; grid-template-columns: 1fr; gap: 20px 28px; }
.diag { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 8px; }
.diag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Each renderer sets --dmin to its viewBox width; it only becomes a floor (with inner scrolling) at phone width. */
.diag svg { display: block; width: 100%; min-width: 0; height: auto; font-family: var(--mono); font-size: 12px; }
@media (max-width: 720px) { .diag svg { min-width: var(--dmin, 640px); } }
.diag svg text { fill: var(--fg); }
.d-box { fill: var(--bg-3); stroke: var(--line); stroke-width: 1; }
.d-box.hl { fill: color-mix(in srgb, var(--accent) 16%, var(--bg-3)); stroke: var(--accent); }
.d-box.soft { fill: color-mix(in srgb, var(--accent) 7%, var(--bg-3)); stroke: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.d-box.dim { opacity: .35; }
.d-box.frozen { stroke-dasharray: 4 3; stroke: var(--fg-3); }
.d-box.red { stroke: var(--c-back); fill: color-mix(in srgb, var(--c-back) 10%, var(--bg-3)); }
.d-box.ok { stroke: var(--c-ok); fill: color-mix(in srgb, var(--c-ok) 10%, var(--bg-3)); }
.d-box.inv { fill: transparent; stroke-dasharray: 3 3; }
.d-t { fill: var(--fg); font-size: 12px; }
.d-t.s { font-size: 10.5px; }
.d-t.xs { font-size: 9.5px; }
.d-t.m { fill: var(--fg-3); }
.d-t.m2 { fill: var(--fg-2); }
.d-t.a { fill: var(--accent); }
.d-t.b { fill: var(--c-back); }
.d-t.ok { fill: var(--c-ok); }
.d-t.h { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
.d-t.bold { font-weight: 600; }
.d-t.i { font-style: italic; font-family: var(--serif); }
.d-ln { stroke: var(--fg-2); stroke-width: 1.5; fill: none; }
.d-ln.a { stroke: var(--accent); }
.d-ln.b { stroke: var(--c-back); }
.d-ln.ok { stroke: var(--c-ok); }
.d-ln.m { stroke: var(--fg-3); }
.d-ln.thin { stroke-width: 1; }
.d-ln.thick { stroke-width: 3; }
.d-ln.dash { stroke-dasharray: 5 4; }
.d-ln.flow { stroke-dasharray: 6 6; animation: dflow 1.1s linear infinite; }
.d-ln.flow.slow { animation-duration: 2.2s; }
.d-ln.flow.rev { animation-direction: reverse; }
.d-fill { fill: var(--fg-2); }
.d-fill.a { fill: var(--accent); }
.d-fill.b { fill: var(--c-back); }
.d-fill.ok { fill: var(--c-ok); }
.d-fill.m { fill: var(--fg-3); }
.d-fill.bg { fill: var(--bg); }
.d-fill.bg3 { fill: var(--bg-3); }
.d-pulse { animation: dpulse 2.6s ease-in-out infinite; }
.d-glow { filter: drop-shadow(0 0 6px var(--glow-c)); }
@keyframes dflow { to { stroke-dashoffset: -24; } }
@keyframes dpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.arch-text h4 { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin: 16px 0 6px; }
.arch-text h4:first-child { margin-top: 0; }
.arch-text ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.arch-text .intuition { font-size: 17px; font-style: italic; }
.steps-toggle { display: none; }
@media (max-width: 720px) {
  .steps-toggle { display: inline-flex; margin-top: 6px; }
  .arch-text ol[data-collapsed="true"] { display: none; }
}

/* ---------- acceleration ---------- */
.accel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 900px) { .accel-grid { grid-template-columns: 1fr; } }
.accel-grid .wide { grid-column: 1 / -1; }
.fig-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
.fig-head h3 { font-size: 16px; }
.fig-head .k { font: 500 11px var(--mono); color: var(--fg-3); letter-spacing: .1em; }
.fig-cap { font-size: 13px; color: var(--fg-2); margin-top: 8px; max-width: 70ch; }
.starfield { position: relative; }
.starfield svg { display: block; width: 100%; height: auto; overflow: visible; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.fact { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); display: grid; gap: 6px; align-content: start; }
.fact .stat-v { font: 600 clamp(26px, 3vw, 34px)/1 var(--mono); color: var(--fg); letter-spacing: -.02em; }
.fact .t { font-size: 13.5px; color: var(--fg-2); }
.fact .src { font: 11px var(--mono); color: var(--fg-3); }
.src-btn { background: none; border: 0; padding: 0; color: var(--fg-3); font: 11px var(--mono); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
.src-btn:hover { color: var(--accent); }
/* Touch screens: grow the small text buttons to a ~26px hit area without moving the text. */
@media (pointer: coarse) { .src-btn, .link { padding-block: 6px; margin-block: -6px; } .tbl-view summary, .lineage summary { padding-block: 8px; } }

/* ---------- now / questions / myths ---------- */
.front-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 28px; }
.front { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); display: grid; gap: 4px; align-content: start; }
.front .pv { display: flex; align-items: center; gap: 8px; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.front .pv .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--sw); }
.front .nm { font: 500 17px/1.25 var(--display); }
.front .dt { font: 11px var(--mono); color: var(--fg-3); }
.front .nt { font-size: 14px; color: var(--fg-2); }
.bullets { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 28px; margin-bottom: 36px; }
.bullet { padding: 12px 0; border-top: 1px solid var(--line); }
.bullet .tp { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.bullet p { font-size: 15px; }
.q { border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); margin-bottom: 10px; }
.q summary { display: flex; gap: 12px; align-items: baseline; padding: 14px 18px; font: 500 16px/1.35 var(--display); }
.q summary::before { content: "+"; font: 500 14px var(--mono); color: var(--accent); flex: none; width: 20px; }
.q[open] summary::before { content: "−"; }
.q-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 28px; padding: 0 18px 18px; }
.q-body h4 { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 6px; }
.q-body p { font-size: 15px; }
.q-src { padding: 0 18px 14px; }
.myth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px 24px; padding: 14px 0; border-top: 1px solid var(--line); }
@media (max-width: 720px) { .myth { grid-template-columns: 1fr; } }
.myth .cl { font-style: italic; color: var(--fg-2); }
.myth .cl::before, .myth .re::before { display: block; font: 500 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.myth .cl::before { content: attr(data-l); color: var(--fg-3); }
.myth .re::before { content: attr(data-l); color: var(--accent); }
.myth .re { font-size: 15px; }


/* ---------- sources / footer ---------- */
.src-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.src-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.src-list li:first-child { border-top: 0; }
.src-list .id { font: 500 11px/1.6 var(--mono); color: var(--fg-3); }
.src-list .ti { color: var(--fg); }
.src-list .ti a { text-decoration-color: var(--fg-3); text-underline-offset: 3px; }
.src-list .og { grid-column: 2; font: 11px var(--mono); color: var(--fg-3); }
.src-group { margin-bottom: 18px; }
.src-group h4 { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 6px; }
.all-src > summary { display: inline-flex; gap: 10px; align-items: baseline; font: 400 20px var(--display); }
.all-src > summary .cnt { font: 500 12px var(--mono); color: var(--fg-3); }
.all-src[open] > summary { margin-bottom: 16px; }
footer.foot { border-top: 1px solid var(--line); padding-block: 28px 40px; font: 12px/1.6 var(--mono); color: var(--fg-3); }
footer.foot p { max-width: 80ch; }

/* ---------- dialogs & tooltips ---------- */
dialog { background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(600px, calc(100vw - 32px)); max-height: min(80vh, 720px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(3, 5, 9, .6); backdrop-filter: blur(4px); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-2); }
.dlg-head h3 { font-size: 17px; }
.dlg-body { padding: 16px 20px 20px; overflow: auto; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: baseline; font-size: 14px; }
.keys kbd { font: 500 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 7px; background: var(--bg-3); white-space: nowrap; }
.notice { margin: 24px auto; max-width: 720px; padding: 16px 20px; border: 1px dashed var(--c-back); border-radius: 12px; color: var(--fg-2); font-size: 14px; }
/* Diagram signal-flow animations stop for readers who prefer reduced motion (also covers live OS toggles). */
@media (prefers-reduced-motion: reduce) { .d-ln.flow, .d-pulse, .diag svg * { animation: none !important; } }
</style>
</head>
